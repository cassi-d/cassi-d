<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirdia Car Poster</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .poster {
            width: 600px;
            height: 900px;
            background: linear-gradient(180deg, #0F172A 0%, #1e293b 100%);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .poster::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: rgba(14, 165, 233, 0.1);
            border-radius: 50%;
        }
        
        .poster::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: rgba(22, 163, 74, 0.1);
            border-radius: 50%;
        }
        
        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        
        .tagline {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        
        .sub-tagline {
            font-size: 18px;
            color: #0EA5E9;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        
        .services {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        
        .service-tag {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .veteran-badge {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        
        .veteran-badge::before,
        .veteran-badge::after {
            content: '★';
            font-size: 16px;
        }
        
        .trust-badges {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }
        
        .trust-badge {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }
        
        .divider {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0EA5E9, transparent);
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }
        
        .contact-section {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .phone {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 52px;
            font-weight: 900;
            color: white;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        
        .phone-icon {
            display: inline-block;
            margin-right: 10px;
        }
        
        .website {
            font-size: 28px;
            font-weight: 700;
            color: #0EA5E9;
            margin-bottom: 10px;
        }
        
        .instagram {
            font-size: 20px;
            color: #e879f9;
            font-weight: 600;
            margin-bottom: 30px;
        }
        
        .cta {
            background: linear-gradient(135deg, #0EA5E9 0%, #0284c7 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4);
            position: relative;
            z-index: 1;
            margin-bottom: 25px;
        }
        
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        
        .qr-code {
            width: 100px;
            height: 100px;
            background: white;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        .qr-label {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 8px;
            font-weight: 500;
        }
        
        .nj-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            z-index: 1;
        }
        
        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .poster {
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <img src="https://customer-assets.emergentagent.com/job_cleanstreets-nj/artifacts/n9fdovtq_Untitled_design-removebg-preview.png" alt="Dirdia Logo" class="logo">
        
        <div class="tagline">Commercial & Street Cleaning</div>
        <div class="sub-tagline">Professional Services in New Jersey</div>
        
        <div class="services">
            <span class="service-tag">✓ Office</span>
            <span class="service-tag">✓ Medical</span>
            <span class="service-tag">✓ Industrial</span>
            <span class="service-tag">✓ Retail</span>
            <span class="service-tag">✓ Schools</span>
        </div>
        
        <div class="veteran-badge">Veteran Owned</div>
        
        <div class="trust-badges">
            <span class="trust-badge">Licensed & Insured</span>
            <span class="trust-badge">•</span>
            <span class="trust-badge">Eco-Friendly</span>
            <span class="trust-badge">•</span>
            <span class="trust-badge">SBE Certified</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="contact-section">
            <div class="phone">
                <span class="phone-icon">📞</span>(240) 496-7636
            </div>
            <div class="website">dirdia.com</div>
            <div class="instagram">📷 @dirdia_</div>
        </div>
        
        <div class="cta">Free Quotes Available</div>
        
        <div class="qr-section">
            <img src="https://customer-assets.emergentagent.com/job_cleanstreets-nj/artifacts/znr9bxsh_qr-code.png" alt="QR Code" class="qr-code">
            <span class="qr-label">Scan for Website</span>
        </div>
        
        <div class="nj-badge">Serving All of NJ</div>
    </div>
</body>
</html>
