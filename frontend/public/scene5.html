<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirdia - Scene 5 Contact Info</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .scene {
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #0F172A 0%, #1e293b 50%, #0F172A 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background elements */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
        }
        
        .bg-glow-1 {
            top: -200px;
            left: -200px;
            background: #0EA5E9;
        }
        
        .bg-glow-2 {
            bottom: -200px;
            right: -200px;
            background: #16a34a;
        }
        
        .bg-glow-3 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0EA5E9;
            opacity: 0.15;
            width: 800px;
            height: 800px;
        }
        
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        
        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 50px;
            filter: drop-shadow(0 0 30px rgba(14, 165, 233, 0.5));
        }
        
        .phone-label {
            font-size: 24px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 15px;
        }
        
        .phone {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 120px;
            font-weight: 900;
            color: white;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-shadow: 0 0 60px rgba(14, 165, 233, 0.5);
        }
        
        .divider {
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0EA5E9, transparent);
            margin: 0 auto 40px;
        }
        
        .website {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 72px;
            font-weight: 700;
            color: #0EA5E9;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(14, 165, 233, 0.4);
        }
        
        .instagram {
            font-size: 36px;
            color: #e879f9;
            font-weight: 600;
            margin-bottom: 50px;
        }
        
        .cta {
            display: inline-block;
            background: linear-gradient(135deg, #0EA5E9 0%, #0284c7 100%);
            color: white;
            padding: 25px 80px;
            border-radius: 60px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 36px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 20px 60px rgba(14, 165, 233, 0.4);
        }
        
        .badges {
            position: absolute;
            bottom: 60px;
            display: flex;
            gap: 40px;
            color: #64748b;
            font-size: 18px;
            font-weight: 500;
        }
        
        .badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .badge-icon {
            width: 24px;
            height: 24px;
            background: #0EA5E9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
        <div class="bg-glow bg-glow-3"></div>
        
        <div class="content">
            <img src="https://customer-assets.emergentagent.com/job_cleanstreets-nj/artifacts/n9fdovtq_Untitled_design-removebg-preview.png" alt="Dirdia Logo" class="logo">
            
            <div class="phone-label">Call Us Today</div>
            <div class="phone">(240) 496-7636</div>
            
            <div class="divider"></div>
            
            <div class="website">dirdia.com</div>
            <div class="instagram">@dirdia_</div>
            
            <div class="cta">Free Quotes Available</div>
        </div>
        
        <div class="badges">
            <div class="badge">
                <span class="badge-icon">✓</span>
                Veteran Owned
            </div>
            <div class="badge">
                <span class="badge-icon">✓</span>
                Licensed & Insured
            </div>
            <div class="badge">
                <span class="badge-icon">✓</span>
                Eco-Friendly
            </div>
            <div class="badge">
                <span class="badge-icon">✓</span>
                Serving All of NJ
            </div>
        </div>
    </div>
</body>
</html>
